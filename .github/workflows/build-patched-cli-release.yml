name: Build and release 9Router CLI

on:
  push:
    branches:
      - dev
    paths:
      - "cli/**"
      - "open-sse/**"
      - "src/**"
      - "app/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/build-patched-cli-release.yml"

permissions:
  contents: write

concurrency:
  group: 9router-patch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          MAKEFLAGS: "-j1"
        run: |
          npm install --no-audit --no-fund --no-progress
          npm install --prefix cli --no-audit --no-fund --no-progress

      - name: Install test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund --no-progress vitest

      - name: Run OpenCode regression tests
        run: |
          ./node_modules/.bin/vitest run \
            tests/unit/opencode-fingerprint.test.js \
            tests/unit/opencode-free-tool-choice.test.js \
            tests/unit/opencode-muse-spark-thinking.test.js \
            tests/unit/opencode-session.test.js \
            tests/unit/opencode-go-session.test.js 

      - name: Build CLI package
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          MAKEFLAGS: "-j1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run cli:pack

      - name: Validate package
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./cli/package.json').version")"
          TARBALL="9router-${VERSION}.tgz"
          test -f "$TARBALL"
          tar -tzf "$TARBALL" >/dev/null
          PACKAGE_VERSION="$(tar -xOf "$TARBALL" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$PACKAGE_VERSION" = "$VERSION"
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TARBALL="${{ steps.package.outputs.tarball }}"
          TAG="v${VERSION}"
          NOTES="Fixes OpenCode v2 free-tier inference compatibility, including endpoint routing, session headers, and tool fingerprint handling."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "9Router $TAG" --notes "$NOTES" --latest
            gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" --clobber
          else
            gh release create "$TAG" "$TARBALL" "$TARBALL.sha256" \
              --title "9Router $TAG" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest
          fi

          if gh release view opencode-session-4828 >/dev/null 2>&1; then
            gh release delete opencode-session-4828 --yes --cleanup-tag
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 9router-cli-${{ steps.package.outputs.version || 'build' }}
          path: |
            9router-*.tgz
            9router-*.tgz.sha256
          if-no-files-found: warn
          retention-days: 14
