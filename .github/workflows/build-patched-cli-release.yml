name: Build and release 9Router CLI

on:
  push:
    branches:
      - dev
    paths:
      - "cli/**"
      - "open-sse/**"
      - "src/**"
      - "app/**"
      - "scripts/**"
      - "tests/unit/opencode-session.test.js"
      - "tests/unit/opencode-muse-spark-thinking.test.js"
      - "tests/unit/openai-responses-incomplete.test.js"
      - "tests/unit/headroom-detect.test.js"
      - "tests/unit/headroom.test.js"
      - "tests/unit/headroom-chat-core.test.js"
      - "tests/unit/headroom-process.test.js"
      - "tests/unit/configured-api-key.test.js"
      - "tests/unit/noauth-pinned-pool-failover.test.js"
      - "tests/unit/noauth-proxy-fallback.test.js"
      - "tests/unit/opencode-fingerprint-passthrough-restore.test.js"
      - "tests/unit/opencode-free-deepseek-effort.test.js"
      - "tests/unit/opencode-free-glm-thinking-format.test.js"
      - "tests/unit/stream-tool-call-id.test.js"
      - "tests/translator/thinking-unified.test.js"
      - "tests/unit/headroom-bootstrap.test.js"
      - "tests/unit/token-saver-defaults.test.js"
      - "package.json"
      - ".github/workflows/build-patched-cli-release.yml"

permissions:
  contents: write

concurrency:
  group: 9router-patch-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          MAKEFLAGS: "-j1"
        run: |
          npm install --no-audit --no-fund --no-progress
          npm install --prefix cli --no-audit --no-fund --no-progress

      - name: Install test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund --no-progress vitest

      - name: Run OpenCode regression tests
        run: |
          ./node_modules/.bin/vitest run \
            tests/unit/opencode-fingerprint.test.js \
            tests/unit/opencode-free-tool-choice.test.js \
            tests/unit/opencode-endpoint-retry.test.js \
            tests/unit/opencode-muse-spark-thinking.test.js \
            tests/unit/openai-responses-incomplete.test.js \
            tests/unit/opencode-session.test.js \
            tests/unit/opencode-go-session.test.js \
            tests/unit/headroom-detect.test.js \
            tests/unit/headroom.test.js \
            tests/unit/headroom-chat-core.test.js \
            tests/unit/headroom-process.test.js \
            tests/unit/configured-api-key.test.js \
            tests/unit/noauth-pinned-pool-failover.test.js \
            tests/unit/noauth-proxy-fallback.test.js \
            tests/unit/opencode-fingerprint-passthrough-restore.test.js \
            tests/unit/opencode-free-deepseek-effort.test.js \
            tests/unit/opencode-free-glm-thinking-format.test.js \
            tests/unit/stream-tool-call-id.test.js \
            tests/translator/thinking-unified.test.js \
            tests/unit/headroom-bootstrap.test.js \
            tests/unit/token-saver-defaults.test.js

      - name: Build CLI package
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          CI: "1"
          MAKEFLAGS: "-j1"
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run cli:pack

      - name: Validate package
        id: package
        shell: bash
        run: |
          VERSION="$(node -p "require('./cli/package.json').version")"
          TARBALL="9router-${VERSION}.tgz"
          test -f "$TARBALL"
          tar -tzf "$TARBALL" >/dev/null
          PACKAGE_VERSION="$(tar -xOf "$TARBALL" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          test "$PACKAGE_VERSION" = "$VERSION"
          sha256sum "$TARBALL" | tee "$TARBALL.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          TARBALL="${{ steps.package.outputs.tarball }}"
          TAG="v${VERSION}"
          NOTES="Defers Headroom installation until requested token-saver settings are saved, avoiding stale ML-enabled settings during startup."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          gh release create "$TAG" "$TARBALL" "$TARBALL.sha256" \
            --title "9Router $TAG" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 9router-cli-${{ steps.package.outputs.version || 'build' }}
          path: |
            9router-*.tgz
            9router-*.tgz.sha256
          if-no-files-found: warn
          retention-days: 14
