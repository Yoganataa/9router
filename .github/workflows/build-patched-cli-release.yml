name: Build patched 9Router CLI

on:
  push:
    branches:
      - fix/opencode-canonical-session-release

concurrency:
  group: patched-cli-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install --prefix cli --no-audit --no-fund
      - name: Build CLI package
        run: npm run cli:pack
      - name: Validate package
        run: |
          test -f 9router-0.5.99.tgz
          tar -tzf 9router-0.5.99.tgz >/dev/null
          sha256sum 9router-0.5.99.tgz
      - name: Publish public patched package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="opencode-session-4828"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" 9router-0.5.99.tgz --clobber
          else
            gh release create "$TAG" 9router-0.5.99.tgz \
              --title "9Router OpenCode session patch (unofficial)" \
              --notes "Prebuilt CLI package from Yoganataa/9router with the session compatibility patch from upstream PR #4828." \
              --target "${GITHUB_SHA}"
          fi
